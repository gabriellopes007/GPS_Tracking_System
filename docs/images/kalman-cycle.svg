<svg xmlns="http://www.w3.org/2000/svg" width="680" height="556" viewBox="0 0 680 556" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Kalman cycle per axis</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="556" fill="#FFFFFF"/>
<rect x="60" y="30" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Previous state</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">x = [position, velocity], P</text>
<line x1="220" y1="86" x2="220" y2="114" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="116" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="135" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">1. Predict</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">x = F·x + B·a ; P = F·P·Fᵀ + Q</text>
<line x1="220" y1="172" x2="220" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="202" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="221" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">2. Innovation</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">y = z − H·x ; S = H·P·Hᵀ + R</text>
<line x1="220" y1="258" x2="220" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="288" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="307" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">3. Kalman gain</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">K = P·Hᵀ·S⁻¹</text>
<line x1="220" y1="344" x2="220" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="374" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="393" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">4. Correct</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="412" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">x = x + K·y ; P = P − K·H·P</text>
<line x1="220" y1="430" x2="220" y2="458" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="460" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="479" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Filtered position</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="498" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">x[0] becomes the previous state</text>
<path d="M60 488 L30 488 L30 58 L58 58" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440" y="116" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="540.0" y="135" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Acceleration a</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="540.0" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">control input u</text>
<line x1="440" y1="144" x2="382" y2="144" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440" y="202" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="540.0" y="221" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Measurement z</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="540.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">[distance, speed]</text>
<line x1="440" y1="230" x2="382" y2="230" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440" y="288" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="540.0" y="307" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Fixed matrices</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="540.0" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">F, B, H, Q, R (use dt)</text>
<line x1="440" y1="316" x2="382" y2="316" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
